version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: url_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_ROOT_PASSWORD: Root@1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: url_fastapi_backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Root@1234
      - DB_NAME=url_shortener
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  nginx:
    build: ./frontend
    container_name: url_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d   # Mounts custom reverse-proxy config
    depends_on:
      - backend
      - db

volumes:
  mysql_data: